name: Google Messages comparison

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - app/src/main/**
      - dev/compare/**
      - .github/workflows/messages-comparison.yml

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android API 37 SDK
        run: sdkmanager 'platforms;android-37.2' 'build-tools;37.0.0'
      - name: Fetch Google Messages (research reference only, never redistributed)
        run: |
          mkdir -p /tmp/gm
          curl -sSL -o /tmp/apkeep https://github.com/EFForg/apkeep/releases/latest/download/apkeep-x86_64-unknown-linux-gnu
          chmod +x /tmp/apkeep
          /tmp/apkeep -a com.google.android.apps.messaging -d apk-pure -o 'acknowledge_dangers=true,arch=x86_64' /tmp/gm
          mv /tmp/gm/*.apk /tmp/gm/messages.apk
      - name: Enable Android emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install Pillow for capture helpers
        run: pip install --quiet pillow
      - name: Capture Send and Google Messages on the same emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          # Google APIs image (Play services, which current Messages requires); its stale
          # built-in Messages is replaced from the writable system image by the capture script.
          target: google_apis
          # SwANGLE: under swiftshader_indirect the emulator hangs and exits as soon as Messages
          # draws its blurred message-selection overlay (gm-message-actions).
          emulator-options: -writable-system -no-window -gpu swangle_indirect -no-snapshot -noaudio -no-boot-anim
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          script: dev/compare/run-on-emulator.sh
      - name: Build comparison report
        if: always()
        run: |
          sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install --quiet pillow
          python3 dev/compare/compare.py /tmp/compare/ref /tmp/compare/Send /tmp/compare/report "$(cat /tmp/compare/dpi)"
          cat /tmp/compare/report/report.md >>"$GITHUB_STEP_SUMMARY"
      - name: Upload comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Messages-Comparison
          path: /tmp/compare/
          if-no-files-found: warn
          retention-days: 30
