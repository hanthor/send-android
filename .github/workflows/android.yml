name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android API 37 SDK
        run: sdkmanager 'platforms;android-37.2' 'build-tools;37.0.0'
      - name: Assemble, test, and lint
        run: ./gradlew --no-daemon "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - name: Run emulator UI smoke tests and capture screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: |
            set +e
            ./gradlew --no-daemon "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" :app:connectedDebugAndroidTest
            test_status=$?
            mkdir -p /tmp/send-ui-screenshots
            screenshot_status=0
            adb exec-out run-as dev.send.matrix cat cache/send-home-screen.png > /tmp/send-ui-screenshots/send-home-screen.png || screenshot_status=$?
            adb exec-out run-as dev.send.matrix cat cache/send-conversation-screen.png > /tmp/send-ui-screenshots/send-conversation-screen.png || screenshot_status=$?
            if [ "$test_status" -ne 0 ]; then exit "$test_status"; fi
            exit "$screenshot_status"
      - name: Upload Android instrumentation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Send-Android-Test-Results
          path: |
            app/build/reports/androidTests/connected/debug/**
            app/build/outputs/androidTest-results/connected/debug/**
          if-no-files-found: warn
          retention-days: 30
      - name: Upload installable debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Send-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload UI comparison screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Send-UI-Screenshots
          path: /tmp/send-ui-screenshots/*.png
          if-no-files-found: warn
          retention-days: 30
