name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android API 37 SDK and the NDK (android.ndkVersion; strips the bundled .so files)
        run: sdkmanager 'platforms;android-37.2' 'build-tools;37.0.0' 'ndk;29.0.14206865'
      - name: Third-party notices cover every release dependency
        run: |
          # The resolved release runtime classpath (what R8 packs into the release APK) against
          # dev/notices/coverage.txt and THIRD_PARTY_NOTICES.txt; DEVELOPMENT.md, "Third-party notices".
          ./gradlew --no-daemon -q :app:dependencies --configuration releaseRuntimeClasspath > "$RUNNER_TEMP/release-dependencies.txt"
          dev/check-notices.sh --deps "$RUNNER_TEMP/release-dependencies.txt"
      - name: Start disposable local Synapse and MatrixRTC backend
        run: |
          # The emulator reaches this host as 10.0.2.2, and MatrixRTC hands that address out (LiveKit
          # URL, lk-jwt-service), so the host answers on it as well (DEVELOPMENT.md, "MatrixRTC").
          sudo ip addr add 10.0.2.2/32 dev lo
          docker compose -f dev/matrix/compose.yaml config --quiet
          docker compose -f dev/matrix/compose.yaml run --rm synapse generate
          docker compose -f dev/matrix/compose.yaml up -d
          ready=
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8008/_matrix/client/versions >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ -z "$ready" ]; then docker compose -f dev/matrix/compose.yaml logs synapse; exit 1; fi
      - name: Seed demo Matrix accounts
        run: dev/matrix/seed-demo.sh
      - name: Check MatrixRTC backend
        run: dev/matrix/check-rtc.sh
      - name: Assemble, test, and lint
        run: dev/ci/gradle-log.sh "$RUNNER_TEMP/gradle-build.log" --no-daemon "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - name: Third-party notices cover every bundled native library
        run: dev/check-notices.sh --apk app/build/outputs/apk/debug/app-debug.apk
      - name: Enable Android emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run emulator UI smoke tests and capture screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: dev/ci/gradle-log.sh "$RUNNER_TEMP/gradle-connected.log" --no-daemon "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" :app:connectedDebugAndroidTest && mkdir -p /tmp/send-ui-screenshots && adb pull /storage/emulated/0/Download/Send/send-login-hero-screen.png /tmp/send-ui-screenshots/ && adb pull /storage/emulated/0/Download/Send/send-login-screen.png /tmp/send-ui-screenshots/ && adb pull /storage/emulated/0/Download/Send/send-home-screen.png /tmp/send-ui-screenshots/ && adb pull /storage/emulated/0/Download/Send/send-conversation-screen.png /tmp/send-ui-screenshots/ && adb pull /storage/emulated/0/Download/Send/send-new-chat-dialog.png /tmp/send-ui-screenshots/ && adb pull /storage/emulated/0/Download/Send/send-reaction-picker.png /tmp/send-ui-screenshots/ && adb pull /storage/emulated/0/Download/Send/send-demo-create-chat.png /tmp/send-ui-screenshots/ && adb pull /storage/emulated/0/Download/Send/send-demo-conversations.png /tmp/send-ui-screenshots/ && adb pull /storage/emulated/0/Download/Send/send-demo-conversation.png /tmp/send-ui-screenshots/ && mkdir -p /tmp/send-ui-screenshots/all && adb pull /storage/emulated/0/Download/Send/. /tmp/send-ui-screenshots/all/
      - name: Report compile errors and failed tests as annotations
        if: failure()
        run: dev/ci/report-problems.sh "$RUNNER_TEMP/gradle-build.log" "$RUNNER_TEMP/gradle-connected.log"
      - name: Report motion jank (MotionJankTest)
        if: always()
        run: head -n 1 /tmp/send-ui-screenshots/all/send-motion-jank.txt || echo "No jank report (instrumentation stopped before it was pulled; see the test failure message)."
      - name: Upload Android instrumentation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Send-Android-Test-Results
          path: |
            app/build/reports/androidTests/connected/debug/**
            app/build/outputs/androidTest-results/connected/debug/**
          if-no-files-found: warn
          retention-days: 30
      - name: Upload installable debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Send-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload UI comparison screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Send-UI-Screenshots
          path: |
            /tmp/send-ui-screenshots/*.png
            /tmp/send-ui-screenshots/all/send-*-device.png
            /tmp/send-ui-screenshots/all/send-motion-jank.txt
          if-no-files-found: warn
          retention-days: 30
      - name: Show backend logs
        if: failure()
        run: docker compose -f dev/matrix/compose.yaml logs --tail 400 synapse federation livekit lk-jwt-service
      - name: Stop disposable local Synapse backend
        if: always()
        run: docker compose -f dev/matrix/compose.yaml down
