<?xml version="1.0" encoding="UTF-8"?>
<!-- Play feature graphic (1024x500), source of truth for fastlane/.../images/featureGraphic.png. The mark is
     the foreground of send-icon.svg. Text renders with the system's Cantarell/DejaVu Sans at raster time. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="500" viewBox="0 0 1024 500">
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4C6CA3"/>
      <stop offset="1" stop-color="#2F4A78"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="500" fill="url(#field)"/>
  <!-- send-icon.svg foreground at 4x, centred on (250,250). -->
  <g transform="translate(34,30) scale(4)">
    <path fill="#FFFFFF"
        d="M42,30H66A14,14 0 0 1 80,44V58A14,14 0 0 1 66,72H46L34,80L33,68.7A14,14 0 0 1 28,58V44A14,14 0 0 1 42,30Z"/>
    <path fill="none" stroke="#415F91" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"
        d="M41,51H65M55,41L65,51L55,61"/>
  </g>
  <text x="470" y="245" fill="#FFFFFF" font-family="Cantarell, DejaVu Sans, sans-serif" font-weight="bold" font-size="120">Send</text>
  <text x="474" y="312" fill="#D6E3FF" font-family="Cantarell, DejaVu Sans, sans-serif" font-size="38">Messages that stay yours</text>
  <text x="474" y="362" fill="#AAC7FF" font-family="Cantarell, DejaVu Sans, sans-serif" font-size="28">Encrypted Matrix chats and calls</text>
</svg>
